[package]
name = "predator-gnome"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
libloading = "0.9"
serde_json = "1"

[profile.release]
strip = true
lto = true
